# VCA 프록시 백엔드 — 브라우저 /api 요청을 모듈 API로 중계한다.
# 변환 규칙: docs/ARCHITECTURE.md "프록시 변환 규칙" / 계약: openapi/openapi.json(공개), openapi/module-api.json(내부)
server:
  port: 8080

vca:
  module-api:
    # 분석 모듈 API의 베이스 URL (버전 경로 포함). 배포 환경에서는 환경변수 VCA_MODULE_API_BASE_URL로 덮어쓴다.
    base-url: ${VCA_MODULE_API_BASE_URL:http://localhost:8081/v1}
    # 모듈 호출 타임아웃 — 초과 시 브라우저에 504 / VCA-5040
    timeout: 5s
    # 인물 검색(POST /persons/search) 전용 타임아웃 — 영상 검색은 통상 조회보다 오래 걸린다 (계약 v1.2)
    search-timeout: 60s
    # 모듈 응답 본문 허용 상한 — WebClient 기본값 256KB로는 감지 이력이 많은 날의
    # live-analytics 페이지가 잘려 500이 난다 (프레임 이미지 등 바이너리도 이 한도를 지난다)
    max-response-size: 16MB
  # 미디어 서버(MediaMTX) — 카메라 목록 streamUrl 병합용 (계약 v0.9.0, UV-43).
  # api-base-url이 비어 있으면 미디어 서버 미구성 — 전 카메라 streamUrl null (bestframe 폴백)
  media:
    api-base-url: ${VCA_MEDIA_API_BASE_URL:http://localhost:9997}
    stream-url-template: /streams/{cameraId}/whep
    timeout: 2s
  # VCA Admin 백엔드 — 인증(/api/auth/**) 업스트림 (UV-47). 응답이 이미 envelope이라 패스스루
  admin-api:
    base-url: ${VCA_ADMIN_API_BASE_URL:http://localhost:8082}
    timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
