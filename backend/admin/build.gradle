plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.univs'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// BCrypt만 사용 (전체 Spring Security 필터체인은 도입하지 않는다 — 세션은 자체 쿠키 토큰)
	implementation 'org.springframework.security:spring-security-crypto'
	// EMQX 구독 — 모듈이 발행하는 cameras/{id}/status를 적재해 연결/안정도 집계 (UV-53, 모듈 계약 무변경)
	implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
	// 이메일 코드 비밀번호 재설정 (UV-56) — 고객사 SMTP(팀/프로젝트 설정)로 sender 역할만
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// 스키마 마이그레이션 (UV-57) — src/main/resources/db/migration/V*.sql, ddl-auto=validate로 엔티티와 대조
	// Spring Boot 4는 Flyway 자동설정이 별도 스타터로 분리됨 (flyway-core만 넣으면 실행되지 않는다)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
