# VCA Admin 백엔드 — 카메라 원장의 단일 원천 (docs/design-vca-admin.md, UV-41/UV-42)
# 로컬 DB: backend/admin/docker-compose.yml (PostgreSQL, 호스트 5433)
server:
  port: 8082

spring:
  datasource:
    url: ${VCA_ADMIN_DB_URL:jdbc:postgresql://localhost:5433/vca_admin}
    username: ${VCA_ADMIN_DB_USER:vca}
    password: ${VCA_ADMIN_DB_PASSWORD:vca}
  jpa:
    # 스키마는 Flyway(db/migration)가 소유 (UV-57). Hibernate는 기동 시 엔티티↔테이블 대조만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # ddl-auto=update 시절(UV-41~56)에 만들어진 기존 DB는 V1 베이스라인이 이미 적용된 것으로 표시하고 V2+만 실행
    # 빈 DB는 V1부터 전부 실행. 스키마 변경은 반드시 V{n}__*.sql 추가 + 엔티티 동시 수정
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: baseline

vca:
  admin:
    # 분석 모듈 API (provisioning 대상, 계약 v1.9) — 프록시와 같은 모듈을 바라본다
    module-base-url: ${VCA_MODULE_API_BASE_URL:http://localhost:8081/v1}
    module-timeout: 5s
    # 미디어 서버(MediaMTX) 제어 API — 스트림 path 동기화 대상 (P2, UV-43). 빈 값이면 동기화 생략
    media-api-base-url: ${VCA_MEDIA_API_BASE_URL:http://localhost:9997}
    # 자격증명 암호화 키 — 운영에서는 반드시 환경변수로 주입 (키 변경 시 기존 암호문 복호화 불가)
    enc-key: ${VCA_ADMIN_ENC_KEY:vca-admin-dev-only-key}
    # 원장이 비어 있으면 기존 기본 카메라 8대 시드 (Old VCA 이관 확정 전 자리)
    seed-default-cameras: ${VCA_ADMIN_SEED:true}
    # 세션 쿠키 Secure 플래그 (UV-47) — 로컬 http 개발이라 기본 false, TLS 운영에서는 true
    session-cookie-secure: ${VCA_ADMIN_COOKIE_SECURE:false}
    # 계정 원장이 비어 있으면 시드할 초기 운영자 (UV-47) — 운영에서는 비밀번호를 반드시 환경변수로 주입
    seed-admin-email: ${VCA_ADMIN_SEED_EMAIL:admin@univs.ai}
    seed-admin-password: ${VCA_ADMIN_SEED_PASSWORD:VcaAdmin1234!}
    # 조직 자체 생성(/auth/signup) 허용 (UV-51) — 온프레미스 전용이라 기본 false. 프론트 authConfig.selfSignup과 일치시킬 것
    self-signup: ${VCA_ADMIN_SELF_SIGNUP:false}
    # EMQX 구독 (UV-53) — 모듈의 cameras/{id}/status(RUNNING|STOPPED)를 적재해 Portal 연결/안정도 집계. 빈 값이면 생략
    mqtt-broker-url: ${VCA_MQTT_URL:tcp://localhost:1883}
    mqtt-site-id: ${VCA_SITE_ID:sg}
    # 재설정 코드 메일을 보내지 않고 로그로 (UV-56) — 개발 전용. 운영은 반드시 false
    mail-dev-log: ${VCA_ADMIN_MAIL_DEV_LOG:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
